# Gradle wrapper config — pins Gradle version for this project
#
# Why Gradle 8.9:
#   - Recommended by AGP 8.7.x release notes
#   - Full JDK 21 support (better than 8.7 which had partial 21 support)
#   - Stable release (Aug 2024)
#   - Compatible with both JDK 21 and JDK 25
#
# Compatibility matrix:
#   - Gradle 8.5  → JDK 8-21
#   - Gradle 8.7  → JDK 8-21 (we used this as 8.5.2 compatible)
#   - Gradle 8.9  → JDK 8-21 (recommended for AGP 8.7+)
#   - Gradle 9.x  → requires AGP 8.8+
#
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists


