# Project-wide Gradle settings
# AndroidX migration (required for modern Android dev)
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# Disable transitive R class — speeds up builds and reduces R class bloat
android.nonTransitiveRClass=true
# JVM args — give Gradle daemon enough heap to avoid OOM during sync
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Parallel builds — speeds up multi-module projects
org.gradle.parallel=true
# Configure-on-demand — disable to avoid issues with single-module projects
org.gradle.configureondemand=false
# Suppress the warning about missing package info for some Kotlin libs
android.suppressUnsupportedCompileSdk=34
